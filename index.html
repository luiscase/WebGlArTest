<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js"></script>
    <script>
        (function() {
            function installMeshoptPatch() {
                if (!window.THREE || !THREE.GLTFLoader || !THREE.GLTFLoader.prototype || THREE.GLTFLoader.prototype.__meshoptPatched) {
                    return false;
                }

                const originalLoad = THREE.GLTFLoader.prototype.load;
                THREE.GLTFLoader.prototype.load = function(url, onLoad, onProgress, onError) {
                    const loader = this;
                    const loadModel = function() {
                        return originalLoad.call(loader, url, onLoad, onProgress, onError);
                    };

                    if (typeof MeshoptDecoder !== 'undefined' && typeof loader.setMeshoptDecoder === 'function') {
                        MeshoptDecoder.ready.then(function() {
                            loader.setMeshoptDecoder(MeshoptDecoder);
                            loadModel();
                        }).catch(function(error) {
                            console.warn('Meshopt decoder no pudo inicializarse en A-Frame:', error);
                            loadModel();
                        });
                        return;
                    }

                    return loadModel();
                };

                THREE.GLTFLoader.prototype.__meshoptPatched = true;
                return true;
            }

            installMeshoptPatch();
            document.addEventListener('DOMContentLoaded', installMeshoptPatch);
        })();
    </script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: ./marker.mind; maxTrack: 1; autoStart: false; uiError:no; uiLoading:no; uiScanning:no;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic;" gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/;">
        <a-assets timeout="30000">
            <video id="ar-video-1" data-target-index="0" src="./video_1.mp4" loop muted playsinline crossorigin="anonymous"></video>
            
            <img id="ar-image-1" src="./image_1.png" crossorigin="anonymous">
<img id="ar-image-2" src="./image_2.png" crossorigin="anonymous">
            
            
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>
        
        <a-entity id="ar-target" data-webar-target data-target-index="0" mindar-image-target="targetIndex: 0">
            
            
            
            <a-plane
                src="#ar-video-1"
                position="0 0 0.1"
                rotation="0 0 0"
                height="0.68"
                width="1.208888888888889"
            ></a-plane>
            <a-plane src="#ar-image-1" material="transparent: true; alphaTest: 0.01; side: double"
            position="-0.66 -0.04 0.16"
            rotation="0 0 0"
            height="0.63" width="0.5136101694915255"></a-plane>
<a-plane src="#ar-image-2" material="transparent: true; alphaTest: 0.01; side: double"
            position="0 -0.06 0"
            rotation="0 0 0"
            height="0.79" width="1.4044444444444444"></a-plane>
            
        </a-entity>
    </a-scene>
    
    <style>
        .webar-video-controls {
            position: fixed;
            left: 50%;
            bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 10020;
            display: flex;
            width: min(94vw, 430px);
            gap: 10px;
            padding: 8px;
            transform: translateX(-50%);
            border: 1px solid rgba(255,255,255,.24);
            border-radius: 8px;
            background: rgba(8,15,22,.88);
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .webar-video-controls button {
            flex: 1;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 6px;
            color: #fff;
            background: #1d4ed8;
            font: 700 14px/1.2 system-ui, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
        }
        .webar-video-controls button:last-child {
            background: #126b55;
        }
        .webar-video-controls button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }
    </style>
    <div class="webar-video-controls" role="group" aria-label="Controles de video">
        <button id="webar-video-play" type="button">Pausar video</button>
        <button id="webar-video-sound" type="button">Activar sonido</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const arTargets = Array.from(document.querySelectorAll('[data-webar-target]'));
            const videos = Array.from(document.querySelectorAll('video[id^="ar-video-"]'));
            const playButton = document.querySelector('#webar-video-play');
            const soundButton = document.querySelector('#webar-video-sound');

            const playVideos = () => Promise.all(videos.map(video => video.play().catch(error => {
                console.warn('El navegador requiere interacción para reproducir el video.', error);
            })));
            const pauseVideos = () => videos.forEach(video => video.pause());
            const updateLabels = () => {
                if (playButton) {
                    playButton.textContent = videos.some(video => video.paused) ? 'Reproducir video' : 'Pausar video';
                }
                if (soundButton) {
                    soundButton.textContent = videos.every(video => video.muted) ? 'Activar sonido' : 'Silenciar sonido';
                }
            };

            arTargets.forEach(target => {
                const targetIndex = Number(target.dataset.targetIndex || 0);
                const targetVideos = () => videos.filter(video => Number(video.dataset.targetIndex || 0) === targetIndex);
                target.addEventListener('targetFound', () => {
                    Promise.all(targetVideos().map(video => video.play().catch(error => {
                        console.warn('El navegador requiere interacción para reproducir el video.', error);
                    }))).finally(updateLabels);
                });
                target.addEventListener('targetLost', () => {
                    targetVideos().forEach(video => video.pause());
                    updateLabels();
                });
            });

            playButton?.addEventListener('click', event => {
                event.stopPropagation();
                const shouldPlay = videos.some(video => video.paused);
                (shouldPlay ? playVideos() : Promise.resolve(pauseVideos())).finally(updateLabels);
            });

            soundButton?.addEventListener('click', event => {
                event.stopPropagation();
                const shouldEnableSound = videos.every(video => video.muted);
                videos.forEach(video => {
                    video.muted = !shouldEnableSound;
                    video.volume = 1;
                });
                if (shouldEnableSound) {
                    playVideos().finally(updateLabels);
                } else {
                    updateLabels();
                }
            });

            videos.forEach(video => {
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.addEventListener('play', updateLabels);
                video.addEventListener('pause', updateLabels);
                video.addEventListener('volumechange', updateLabels);
            });
            updateLabels();
        });
    </script>
    
    <script>
    (() => {
        const config = {"exposure":1,"toneMapping":"aces"};
        const apply = () => {
            const scene = document.querySelector('a-scene');
            const renderer = scene?.renderer;
            const three = window.AFRAME?.THREE || window.THREE;
            if (!renderer || !three) return false;
            renderer.toneMapping = config.toneMapping === 'linear'
                ? three.NoToneMapping
                : config.toneMapping === 'neutral'
                    ? three.NeutralToneMapping
                    : three.ACESFilmicToneMapping;
            renderer.toneMappingExposure = Number(config.exposure || 1);
            if (three.SRGBColorSpace) renderer.outputColorSpace = three.SRGBColorSpace;
            return true;
        };
        const scene = document.querySelector('a-scene');
        if (!apply()) {
            scene?.addEventListener('renderstart', apply, { once: true });
            scene?.addEventListener('loaded', apply, { once: true });
            window.setTimeout(apply, 250);
        }
    })();
    </script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sceneEl = document.querySelector('a-scene');
            let arSystemRunning = false;
            
            sceneEl.addEventListener('loaded', function () {
                const arSystem = sceneEl.systems['mindar-image-system'];
                if (arSystem && arSystem.start && !arSystemRunning) {
                    arSystem.start();
                    arSystemRunning = true;
                }
                
            });
        });
    </script>
</body>
</html>
